plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	// GLASS_TEST_ONLY=stress sends a holo scan bigger than one packet, which Fabric splits below the level the client
	// gametest's network synchroniser can follow; it says to switch the synchroniser off for that.
	if(System.getenv("GLASS_TEST_ONLY") == "stress") {
		runs.configureEach {
			vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
		}
	}

	mods {
		"generallaymansaestheticspyingscreen" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// In-game client tests (src/gametest): ./gradlew runClientGameTest
	// Dedicated server tests (no client code): ./gradlew runGameTest
	configureTests {
		createSourceSet = true
		modId = "glass-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

repositories {
	// Only for the compatibility runs below (Sodium, Iris); never part of the built jar.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The Sodium view backend (ViewBackend.SODIUM) hooks into Sodium's renderer: compiled against it, never shipped.
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	// DistantHorizonsClouds copies Distant Horizons' clouds into GLASS's views (only when it is installed): compiled
	// against it, never shipped.
	modCompileOnly "maven.modrinth:distanthorizons:${project.dh_version}"

	// Compatibility runs: ./gradlew runClient -PwithSodium (or -PwithIris, which brings Sodium too).
	if(project.hasProperty("withSodium") || project.hasProperty("withIris")) {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
	if(project.hasProperty("withIris")) {
		modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
		// Iris bundles these inside its jar, which a dev run does not load: without them picking a shader pack crashes
		// (NoClassDefFoundError: org/anarres/cpp/PreprocessorListener). Keep them in step with the Iris version.
		localRuntime "org.anarres:jcpp:1.4.14"
		localRuntime "io.github.douira:glsl-transformer:3.0.0-pre3"
		localRuntime "org.antlr:antlr4-runtime:4.13.1"
	}
	// ./gradlew runClient -PwithDH: Distant Horizons (draws far terrain itself, so a cloak could show up in it).
	if(project.hasProperty("withDH")) {
		modLocalRuntime "maven.modrinth:distanthorizons:${project.dh_version}"
	}
	// ./gradlew runClient -PwithXaero: Xaero's Minimap (maps the blocks around the player, so a cloak could show on it).
	if(project.hasProperty("withXaero")) {
		modLocalRuntime "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
		// The minimap carries XaeroLib inside its jar, which the development copy leaves out: take it out of the jar into a
		// local folder and add it as a normal dependency, so it is remapped along with the minimap (as a plain file it was
		// not on the minimap's remapping classpath, and the minimap's screens kept a field name the dev game lacks).
		def minimap = configurations.detachedConfiguration(dependencies.create("maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}")).singleFile
		def xaeroLibDir = layout.buildDirectory.dir("xaerolib").get().asFile
		def xaeroLib = zipTree(minimap).matching { include "META-INF/jars/xaerolib-*.jar" }.singleFile
		def xaeroLibName = xaeroLib.name.replaceAll(/\.jar$/, "")
		copy {
			from xaeroLib
			into xaeroLibDir
		}
		repositories {
			flatDir {
				dirs xaeroLibDir
			}
		}
		modLocalRuntime ":${xaeroLibName}"
		// ./gradlew runClient -PwithXaero also brings Xaero's World Map (it maps the world too).
		modLocalRuntime "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
	}
	// ./gradlew runClient -PwithEntityCulling: Entity Culling (skips drawing mobs and block entities the player cannot see).
	if(project.hasProperty("withEntityCulling")) {
		modLocalRuntime "maven.modrinth:entityculling:${project.entityculling_version}"
		// Entity Culling carries its libraries (TRansition, TRender) inside its jar, which the development copy leaves out:
		// take them out into a local folder and add them, as with XaeroLib and JourneyMap.
		def entityCulling = configurations.detachedConfiguration(dependencies.create("maven.modrinth:entityculling:${project.entityculling_version}")).singleFile
		def ecLibDir = layout.buildDirectory.dir("eclibs").get().asFile
		def ecLibs = zipTree(entityCulling).matching { include "META-INF/jars/*.jar" }.files
		copy {
			from ecLibs
			into ecLibDir
		}
		repositories {
			flatDir {
				dirs ecLibDir
			}
		}
		ecLibs.each { lib -> modLocalRuntime ":${lib.name.replaceAll(/\.jar$/, "")}" }
	}
	// ./gradlew runClient -PwithJM: JourneyMap (maps the blocks around the player too, so a cloak could show on it).
	if(project.hasProperty("withJM")) {
		modLocalRuntime "maven.modrinth:journeymap:${project.journeymap_version}"
		// JourneyMap carries its API, Common Network and PNGJ inside its jar, which the development copy leaves out (it
		// did not start without them): take them out into a local folder and add them, as with XaeroLib above.
		def journeyMap = configurations.detachedConfiguration(dependencies.create("maven.modrinth:journeymap:${project.journeymap_version}")).singleFile
		def jmLibDir = layout.buildDirectory.dir("jmlibs").get().asFile
		def jmLibs = zipTree(journeyMap).matching { include "META-INF/jars/*.jar" }.files
		copy {
			from jmLibs
			into jmLibDir
		}
		repositories {
			flatDir {
				dirs jmLibDir
			}
		}
		jmLibs.each { lib -> modLocalRuntime ":${lib.name.replaceAll(/\.jar$/, "")}" }
	}
}

// Release checks with the real (remapped) jar, as players get it: ./gradlew prodServer, ./gradlew prodClient
// (add -PwithSodium or -PwithIris to the client one). Run dirs: run/prod-server, run/prod-client.
configurations {
	prodMods {
		transitive = false
	}
}

dependencies {
	prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	if(project.hasProperty("withSodium") || project.hasProperty("withIris")) {
		prodMods "maven.modrinth:sodium:${project.sodium_version}"
	}
	if(project.hasProperty("withIris")) {
		prodMods "maven.modrinth:iris:${project.iris_version}"
	}
	if(project.hasProperty("withDH")) {
		prodMods "maven.modrinth:distanthorizons:${project.dh_version}"
	}
	if(project.hasProperty("withXaero")) {
		prodMods "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
		prodMods "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
	}
	if(project.hasProperty("withEntityCulling")) {
		prodMods "maven.modrinth:entityculling:${project.entityculling_version}"
	}
	if(project.hasProperty("withJM")) {
		prodMods "maven.modrinth:journeymap:${project.journeymap_version}"
	}
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	installerVersion = "1.1.2"
	mods.from(tasks.named("remapJar"))
	mods.from(configurations.prodMods)
	programArgs.add("nogui")
	runDir = file("run/prod-server")
}

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(tasks.named("remapJar"))
	mods.from(configurations.prodMods)
	runDir = file("run/prod-client")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	// LGPL-3.0: ship the license texts inside the jar.
	from("COPYING")
	from("COPYING.LESSER")
}
